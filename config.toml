[app]
timeframe = "M15"
symbols = ["EURUSD", "GBPUSD", "USDJPY", "XAUUSD"]
bars = 300

[market_data]
max_quote_age_seconds = 300
max_closed_bar_age_seconds = 2700
max_spread_points = 50

[strategy]
fast_period = 20
slow_period = 50
rsi_period = 14
atr_period = 14
long_rsi = [50.0, 70.0]
short_rsi = [30.0, 50.0]

[risk]
max_trade_risk_fraction = 0.0025
daily_loss_fraction = 0.02
max_daily_drawdown_fraction = 0.02
max_open_trades = 3
stop_atr_multiple = 1.5
reward_risk_ratio = 2.0

[paper]
initial_equity = 10000.0
commission_per_lot_per_side = 3.5
slippage_points = 2
state_path = "data/paper_state.json"
trade_log_path = "logs/trades.csv"
error_log_path = "logs/moses.log"